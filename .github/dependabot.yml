version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/build tooling (vite, vitest, rollup, etc.) into one PR
      dev-dependencies:
        dependency-type: "development"
      # Batch routine production patch/minor bumps together
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
